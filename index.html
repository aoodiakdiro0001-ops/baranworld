function toggleTheme(){document.body.classList.toggle('light');}
function toggleFull(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});}
function doFind(){const q=document.getElementById('findQ').value;if(!q)return;const tx=plainText();let n=0,i=-1;while((i=tx.indexOf(q,i+1))>=0)n++;document.getElementById('findN').textContent=n+' ×';}
function doReplace(){const q=document.getElementById('findQ').value,r=document.getElementById('findR').value;if(!q)return;const sel=window.getSelection();ed().focus();
let n=0;document.execCommand('selectAll',false,null);
const html=ed().innerHTML.split(q).join(r);ed().innerHTML=html;n=html!==undefined?1:0;
document.getElementById('findN').textContent='✓';autoSave();}
function sentences(tx){return (tx.replace(/\s+/g,' ').match(/[^.!?]+[.!?]+["”)]?|\S[^.!?]*$/g)||[]).map(s=>s.trim()).filter(s=>s.length>10);}
function wordsOf(s){return (s.toLowerCase().match(/[a-z\u00c0-\u024f\u0370-\u03ff\u0400-\u04ff\u0600-\u06ff\u0750-\u077f\w]+/g)||[]);}
function aiDo(kind){
const tx=plainText();if(tx.trim().length<40){toast(t('needText'));return;}
const box=document.getElementById('aiOut');let h='';
if(kind==='sum'){const ss=sentences(tx);const freq={};wordsOf(tx).forEach(w=>{if(!STOP2.has(w)&&w.length>2)freq[w]=(freq[w]||0)+1;});
const scored=ss.map(s=>{let sc=0;wordsOf(s).forEach(w=>{sc+=freq[w]||0;});return {s,sc:sc/Math.max(1,wordsOf(s).length)};}).sort((a,b)=>b.sc-a.sc);
const top=scored.slice(0,Math.max(1,Math.min(5,Math.ceil(ss.length/3)))).sort((a,b)=>ss.indexOf(a.s)-ss.indexOf(b.s));
h=`<b>${t('sumL')} (${top.length}/${ss.length} ${t('sentL')})</b><br>`+top.map(x=>'• '+esc(x.s)).join('<br>');}
else if(kind==='kw'){const freq={};wordsOf(tx).forEach(w=>{if(!STOP2.has(w)&&w.length>3)freq[w]=(freq[w]||0)+1;});
const top=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,12);
h=`<b>${t('kwL')}</b><br>`+top.map(w=>`${esc(w)} (${freq[w]})`).join(' · ');}
else if(kind==='read'){const ss=sentences(tx),ws=wordsOf(tx);const asl=ws.length/Math.max(1,ss.length);
let syl=0;ws.forEach(w=>{const m=w.toLowerCase().replace(/[^a-z]/g,'').match(/[aeiouy]+/g);syl+=m?m.length:1;});
const asw=syl/Math.max(1,ws.length);
const fre=Math.max(0,Math.min(100,206.835-1.015*asl-84.6*asw));
h=`<b>${t('readL')}: ${fre.toFixed(1)}/100</b><br>~${asl.toFixed(1)} words/sentence · ~${asw.toFixed(2)} syllables/word`;}
else if(kind==='title'){const ss=sentences(tx);h=`<b>${t('titleL')}</b><br>`+esc((ss[0]||tx).slice(0,80));}
else if(kind==='toc'){const tmp=document.createElement('div');tmp.innerHTML=ed().innerHTML;
const hs=[...tmp.querySelectorAll('h1,h2,h3')].map(x=>x.tagName+' '+x.textContent.trim().slice(0,60));
h=`<b>${t('tocL')}</b><br>`+(hs.length?hs.map(esc).join('<br>'):'—');}
box.innerHTML=h;
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
ed().addEventListener('input',()=>{autoSave();});
document.getElementById('docTitle').addEventListener('input',()=>autoSave());
if(!docs().length)newDoc();else{const c=curId();if(docs().some(d=>d.id===c))openDoc(c);else openDoc(docs()[0].id);}
setLang('en');loadAds();renderDonate();updateStats();
</script>
</body>
</html>
